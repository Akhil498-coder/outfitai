# Default profile: in-memory H2, zero setup. Data is lost on restart.
spring:
  datasource:
    url: jdbc:h2:mem:outfitai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
